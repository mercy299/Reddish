version: '3'
services:
  reddishserver:
    image: 'reddish-server'
    build: ./server
    restart: always
    ports:
      - 3005:3005
    environment:
      MONGODB_URI: 
      OPENAI_API_KEY: 
      CLOUDINARY_CLOUD_NAME: 
      CLOUDINARY_API_KEY: 
      CLOUDINARY_API_SECRET:

  reddishclient:
    image: 'reddish-client'
    build: ./client
    restart: always
    ports:
      - 80:80
    depends_on:
      - reddishserver